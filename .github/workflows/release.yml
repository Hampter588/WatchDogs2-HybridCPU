name: Build and publish installer

on:
  schedule:
    - cron: '0 10 * * 1'
      timezone: America/Los_Angeles
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build installer
        shell: pwsh
        run: ./Build.ps1

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = "build-$env:GITHUB_RUN_ID"
          $installer = Get-Item -LiteralPath './dist/WatchDogs2-HybridCPU-Setup.exe'

          $existing = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft,assets 2>$null
          if ($LASTEXITCODE -eq 0) {
              $release = $existing | ConvertFrom-Json
              if ($release.isDraft -or $installer.Name -notin $release.assets.name) {
                  throw "Release $tag already exists but is incomplete."
              }
              Write-Host "Release $tag already contains the installer."
              exit 0
          }

          $date = [TimeZoneInfo]::ConvertTimeBySystemTimeZoneId(
              [DateTimeOffset]::UtcNow, 'Pacific Standard Time'
          ).ToString('yyyy-MM-dd')
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $notes = "Unsigned x64 Windows installer for supported Watch Dogs 2 builds. SHA-256: $hash"

          $releaseArgs = @(
              'release', 'create', $tag, $installer.FullName, '--repo', $env:GITHUB_REPOSITORY,
              '--target', $env:GITHUB_SHA, '--title', "Installer build $date", '--notes', $notes, '--latest'
          )
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) {
              throw "Unable to publish GitHub release $tag."
          }
